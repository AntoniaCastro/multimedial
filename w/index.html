<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A | Castro</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: white;
            font-family: Arial, sans-serif;
            color: #2a2a2a;
        }

        /* Dos columnas: barra lateral a la izquierda, imagen a la derecha */
        .pagina {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 40px;
            min-height: 100vh;
            padding: 24px 28px 24px 44px;
        }

        /* Barra lateral */
        .lateral {
            display: flex;
            flex-direction: column;
            gap: 56px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: normal;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            line-height: 1.5;
        }

        nav a {
            display: block;
            text-decoration: none;
            color: #2a2a2a;
            font-size: 15px;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            margin: 0 0 30px 0;
            transform-origin: left center;
            /* Tu animación de los enlaces: crecen al pasar el cursor */
            transition: transform 0.3s ease;
        }

        nav a:hover,
        nav a:focus-visible {
            transform: scale(1.3);
            outline: none;
        }

        /* Imagen grande a la derecha */
        .portada {
            margin: 0;
            background-color: #000000; /* color de respaldo si la imagen tarda en cargar */
            min-height: 420px;
            overflow: hidden;
        }

        .portada img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Celular: la barra pasa arriba y la imagen debajo */
        @media (max-width: 760px) {
            .pagina {
                grid-template-columns: 1fr;
                gap: 28px;
                padding: 24px 20px;
            }
            .lateral { gap: 28px; }
            nav a { display: inline-block; margin: 0 24px 0 0; }
            .portada { min-height: 60vh; }
        }

        @media (prefers-reduced-motion: reduce) {
            nav a { transition: none; }
        }
    </style>
</head>
<body>

    <div class="pagina">
        <aside class="lateral">
            <h1>Antonia<br>Castro</h1>
            <nav>
                <a href="obras.html">Obras</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </aside>

        <main class="portada">
            <img src="img/imagenfondo.jpg" alt="Obra de Antonia Castro">
        </main>
    </div>

</body>
</html>
