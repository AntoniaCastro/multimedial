<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Obras</title>
    <style>
        body {
            background-color: rgb(255, 255, 255);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Fila superior: botón Volver y título Obras, uno al lado del otro */
        .encabezado {
            display: flex;
            align-items: center;
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto 30px;
        }

        /* Contenedor principal: Grid de 4 columnas */
        .contenedor-obras {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .bloque-link {
        text-decoration: none;
        color: inherit;
        display: block;
        }

        /* Cada bloque de imagen */
        .bloque {
            position: relative; /* Necesario para posicionar el texto encima */
            aspect-ratio: 1 / 1; /* Mantiene las imágenes cuadradas y del mismo tamaño */
            overflow: hidden;
            background-color: #000;
            border-radius: 0px;
            cursor: pointer;
        }

        /* Imagen que ocupa todo el bloque */
        .bloque img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Recorta la imagen para que llene el cuadrado sin deformarse */
            transition: transform 0.5s ease;
            display: block;
        }

        /* Capa oscura con el texto (oculta por defecto) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7); /* Fondo negro semitransparente */
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0; /* Invisible */
            transition: opacity 0.4s ease;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Efectos al pasar el mouse */
        .bloque:hover img {
            transform: scale(1.1);
        }

        .bloque:hover .overlay {
            opacity: 1; /* Muestra el texto */
        }

       .overlay h3,
       .overlay p {
          margin: 0;
          font-size: 10px;
          font-weight: normal;
          letter-spacing: 0.25em;
          text-transform: uppercase;
          line-height: 1.6;
}
.overlay p {
    margin-top: 10px;
}

        /* Botón Volver */
        .boton {
            display: inline-block;
            background-color: #000000;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            transition: 0.3s;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }

        .boton:hover {
            background-color: #9b9b9b;
            transform: scale(1.1);
        }

        /* Título: ahora en color oscuro, porque en blanco no se veía sobre el fondo blanco */
        h1 { 
            color: #000000;
            margin: 0;
            font-size: 24px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        
        }
    </style>
</head>
<body>

    <div class="encabezado">
        <a href="index.html" class="boton">Volver</a>
        <h1>Obras</h1>
    </div>

    <div class="contenedor-obras">
        
        <a href="alucionacion.html" class="bloque-link">
            <div class="bloque">
                <img src="img/alucinaciondeconsuelo.jpg" alt="Alucinación de consuelo">
                <div class="overlay">
                    <h3>Alucinación de Consuelo</h3>
                    <p>2025 - Impresiones sobre papel</p>
                </div>
            </div>
        </a>

        <a href="amalgama.html" class="bloque-link">
            <div class="bloque">
                <img src="img/amalgama.jpg" alt="Amalgama">
                <div class="overlay">
                    <h3>Amalgama</h3>
                    <p>2025 - Técnica mixta</p>
                </div>
            </div>
        </a>

        <a href="ornamentacion.html" class="bloque-link">
            <div class="bloque">
                <img src="img/ornamentacionquiensabe.jpg" alt="Sin título">
                <div class="overlay">
                    <h3>Sin título</h3>
                    <p>2026 - Impresiones sobre papel</p>
                </div>
            </div>
        </a>

        <a href="serigrafia.html" class="bloque-link">
            <div class="bloque">
                <img src="img/seripoliptico.jpg" alt="Sin título">
                <div class="overlay">
                    <h3>Sin título</h3>
                    <p>2025 - Serigrafía sobre papel</p>
                </div>
            </div>
        </a>

        <a href="continuo.html" class="bloque-link">
            <div class="bloque">
                <img src="img/imagenfondo.jpg" alt="Sin título">
                <div class="overlay">
                    <h3>Sin título</h3>
                    <p>2026 - Xilografías sobre papel</p>
                </div>
            </div>
        </a>

        <a href="serigrafia.html" class="bloque-link">
            <div class="bloque">
                <img src="img/Fragmentos.jpg" alt="Sin título">
                <div class="overlay">
                    <h3>Sin título</h3>
                    <p>2026 - Impresiones adheridas a cartón pluma</p>
                </div>
            </div>
        </a>

    </div>

</body>
</html>
